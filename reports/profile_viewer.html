<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone Trace</title>
<link rel="stylesheet" href="assets/report.css">
<style>
html, body { height: 100%; }
body { overflow: hidden; }
.viewer { display: grid; grid-template: auto 1fr / minmax(0, 1fr); height: 100%; height: 100dvh; background: var(--canvas); }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px;
  background: var(--raised); border-bottom: var(--border-strong);
}
.bar .title { flex: 1 1 260px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 0.78rem var(--font-mono); }
.bar .warn { color: var(--negative); }
.chips { display: flex; align-items: center; }
.chips .eyebrow { flex: none; margin-right: 8px; }
.chips button {
  border: var(--border-thin); margin-left: -1px; background: var(--canvas); color: var(--ink); padding: 3px 9px;
  cursor: pointer; font: 700 0.7rem var(--font-mono); letter-spacing: 0.04em;
}
.chips button[aria-pressed="true"] { background: var(--selected); color: var(--on-selected); }
.chips button:hover:not([aria-pressed="true"]):not(:disabled) { background: var(--hover); color: var(--on-hover); }
.chips button:disabled { opacity: 0.45; cursor: not-allowed; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.legend button {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 0; border: 0; background: none;
  color: var(--ink); cursor: pointer; font: 0.72rem var(--font-mono);
}
.legend button[aria-pressed="false"] { opacity: 0.4; text-decoration: line-through; }
.legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid; }
.hint { color: var(--muted); font-size: 0.72rem; }
.stage { position: relative; min-height: 0; }
canvas {
  display: block; width: 100%; height: 100%; cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
canvas.dragging { cursor: grabbing; }
.tip {
  position: absolute; pointer-events: none; padding: 6px 8px; background: var(--canvas); border: var(--border-thin);
  box-shadow: 4px 4px 0 var(--shadow-ink); font: 0.72rem/1.45 var(--font-mono); white-space: nowrap;
}
.tip b { display: block; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; color: var(--muted); }
.empty label { cursor: pointer; color: var(--ink); border: var(--border-thin); padding: 8px 14px; }
.empty input { display: none; }
@media (pointer: coarse) {
  .chips button { padding: 7px 11px; }
  .legend button { padding: 6px 0; }
}
@media (max-width: 720px) {
  .bar { gap: 6px 10px; padding: 6px 8px; }
  .bar .title { flex-basis: 100%; }
  .legend { flex-wrap: nowrap; max-width: 100%; overflow-x: auto; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="viewer">
  <header class="bar">
    <div class="title" id="title">zone trace</div>
    <div class="chips" id="group" role="group" aria-label="Group by">
      <span class="eyebrow">Group by</span>
      <button type="button" data-group="sm">SM</button><button type="button" data-group="cluster">CLUSTER</button><button type="button" data-group="cta">CTA</button><button type="button" data-group="wg">WG</button><button type="button" data-group="warp">WARP</button>
    </div>
    <div class="chips" id="fold" role="group" aria-label="Fold every group">
      <span class="eyebrow">All</span>
      <button type="button" data-open="true">EXPAND</button><button type="button" data-open="false">FOLD</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint">wheel scrolls · shift+wheel pans · ctrl+wheel zooms · double-click fits · click a group folds, shift+click its subtree</div>
  </header>
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="empty" id="empty">
      <p>Drop a <code>.jsonl.gz</code> trace here, or</p>
      <label>Open a trace<input type="file" id="file" accept=".gz,.jsonl.gz"></label>
      <p id="status"></p>
      <p class="warn" id="error"></p>
    </div>
  </div>
</div>
<span id="probe" hidden></span>
<script>
(() => {
  "use strict";
  const rowHeight = 18;
  const laneHeight = 16;
  const axisHeight = 24;
  const overviewHeight = 28;
  const canvas = document.getElementById("view");
  const context = canvas.getContext("2d");
  const tip = document.getElementById("tip");
  if (matchMedia("(pointer: coarse)").matches) {
    document.querySelector(".hint").textContent = "drag pans · pinch zooms · tap a group folds it · tap a zone shows it · double-tap fits";
  }
  const state = {
    trace: null, linked: false, tree: null, rows: [], group: "sm", fold: { open: false, except: new Set() },
    hidden: new Set(), start: 0, end: 1, scroll: 0, hover: null,
  };
  let colors = null;

  function resolve(token) {
    const probe = document.getElementById("probe");
    probe.hidden = false;
    probe.style.color = `var(${token})`;
    const value = getComputedStyle(probe).color;
    probe.hidden = true;
    return value;
  }

  function mix(from, to, amount) {
    const [a, b] = [from, to].map((color) => color.match(/[\d.]+/g).slice(0, 3).map(Number));
    return `rgb(${a.map((value, index) => Math.round(value + (b[index] - value) * amount)).join(", ")})`;
  }

  function luminance(color) {
    const [r, g, b] = color.match(/[\d.]+/g).slice(0, 3).map(Number);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  }

  function palette() {
    const canvasColor = resolve("--canvas"), surface = resolve("--surface-2");
    const [lavender, amber, teal, rose, sage, orchid] = [1, 3, 5, 2, 4, 6].map((index) => resolve(`--tone-${index}`));
    const fills = [
      lavender, amber, teal, rose, sage, orchid,
      mix(rose, amber, 0.5), mix(lavender, orchid, 0.5), mix(sage, teal, 0.5),
      mix(amber, sage, 0.5), mix(teal, lavender, 0.5), mix(orchid, rose, 0.5),
    ];
    const dark = resolve("--ink-900"), light = resolve("--paper-100");
    return {
      fills,
      edges: fills.map((fill) => mix(fill, canvasColor, 0.45)),
      texts: fills.map((fill) => (luminance(fill) > 0.45 ? dark : light)),
      canvas: canvasColor, ink: resolve("--ink"), muted: resolve("--muted"), grid: resolve("--grid"),
      line: resolve("--line"), selected: resolve("--selected"), close: resolve("--tone-2"), raised: resolve("--raised"),
      header: surface,
      bands: [canvasColor, mix(canvasColor, surface, 0.4)],
      cells: [mix(canvasColor, surface, 0.22), mix(canvasColor, surface, 0.6)],
    };
  }

  async function inflate(bytes) {
    if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) return new TextDecoder().decode(bytes);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).text();
  }


  function clusterOf(launch, cta) {
    const [gx, gy] = launch.grid;
    const [cx, cy, cz] = launch.cluster;
    const x = cta % gx, y = Math.floor(cta / gx) % gy, z = Math.floor(cta / (gx * gy));
    return Math.floor(x / cx) + Math.floor(gx / cx) * (Math.floor(y / cy) + Math.floor(gy / cy) * Math.floor(z / cz));
  }

  function parse(text) {
    const values = JSON.parse(`[${text.trim().split("\n").join(",")}]`);
    const header = values[0];
    if (header.format !== "zigfa.zones") throw new Error("this file is not a zigfa zone trace");
    const launches = [], tracks = [], names = [], nameIndex = new Map();
    const intern = (name) => {
      if (!nameIndex.has(name)) { nameIndex.set(name, names.length); names.push(name); }
      return nameIndex.get(name);
    };
    for (let index = 1; index < values.length; index++) {
      const value = values[index];
      if (value[0] === "L") {
        launches[value[1]] = { kernel: value[2], grid: value[3], cluster: value[4], threads: value[5], zones: value[6].map(intern), dropped: value[7] };
      } else if (value[0] === "T") {
        const launch = launches[value[2]];
        tracks[value[1]] = { launch: value[2], sm: value[3], cta: value[4], warp: value[5], cluster: clusterOf(launch, value[4]), zones: [], closes: [] };
      } else if (value[0] === "Z") {
        tracks[value[1]].zones.push(value);
      } else if (value[0] === "C") {
        tracks[value[1]].closes.push(value[2]);
      }
    }
    let end = 1;
    for (const track of tracks) {
      const rows = track.zones.sort((a, b) => a[3] - b[3]);
      const count = rows.length;
      track.start = new Float64Array(count);
      track.end = new Float64Array(count);
      track.reach = new Float64Array(count);
      track.name = new Int32Array(count);
      track.depth = new Uint8Array(count);
      let reach = -Infinity, deepest = 0;
      rows.forEach((row, index) => {
        track.start[index] = row[3];
        track.end[index] = row[3] + row[4];
        track.name[index] = launches[track.launch].zones[row[2]] ?? intern(`zone ${row[2]}`);
        track.depth[index] = row[5];
        reach = Math.max(reach, track.end[index]);
        track.reach[index] = reach;
        deepest = Math.max(deepest, row[5]);
      });
      track.deepest = deepest;
      track.closes = Float64Array.from(track.closes).sort();
      end = Math.max(end, reach, track.closes.length ? track.closes[track.closes.length - 1] : 0);
      delete track.zones;
    }
    return { header, launches, tracks, names, end, overview: overview(tracks, end) };
  }

  function overview(tracks, end) {
    const bins = new Float64Array(512);
    for (const track of tracks) {
      for (let index = 0; index < track.start.length; index++) {
        if (track.depth[index] !== 0) continue;
        const first = Math.floor(track.start[index] / end * 511), last = Math.floor(track.end[index] / end * 511);
        for (let bin = first; bin <= last; bin++) bins[bin] += 1;
      }
    }
    const peak = Math.max(1, ...bins);
    return bins.map((value) => value / peak);
  }

  const levels = {
    launch: { part: (t) => `L${t.launch}`, order: (t) => t.launch, label: (t) => `L${t.launch} · ${state.trace.launches[t.launch].kernel}` },
    sm: { part: (t) => `sm${t.sm}`, order: (t) => t.sm, label: (t) => `SM ${t.sm}` },
    cluster: { part: (t) => `cluster${t.cluster}`, order: (t) => t.cluster, label: (t) => `cluster ${t.cluster}` },
    cta: {
      part: (t) => `cta${t.cta}`, order: (t) => t.cta,
      label: (t, above) => (above.includes("sm") ? `CTA ${t.cta}` : `CTA ${t.cta} · SM ${t.sm}`),
    },
    wg: {
      part: (t, above) => (above.includes("cta") ? `wg${t.warp >> 2}` : `cta${t.cta}.wg${t.warp >> 2}`),
      order: (t, above) => (above.includes("cta") ? t.warp >> 2 : t.cta * 64 + (t.warp >> 2)),
      label: (t, above) => (above.includes("cta") ? `WG${t.warp >> 2}` : `CTA ${t.cta} · WG${t.warp >> 2}`),
    },
  };
  const hierarchies = { sm: ["sm", "cta", "wg"], cluster: ["cluster", "cta", "wg"], cta: ["cta", "wg"], wg: ["wg"], warp: [] };

  function buildTree() {
    const path = [...(state.trace.launches.length > 1 ? ["launch"] : []), ...hierarchies[state.group]];
    const above = path.map((_, index) => path.slice(0, index));
    const leafLabel = path.includes("wg") ? (t) => `W${t.warp}` : (t) => `SM ${t.sm} · CTA ${t.cta} · W${t.warp}`;
    const keyed = state.trace.tracks.filter(Boolean).map((track) => ({
      track, order: [...path.map((level, index) => levels[level].order(track, above[index])), track.cta, track.warp],
    }));
    keyed.sort((a, b) => {
      for (let index = 0; index < a.order.length; index++) if (a.order[index] !== b.order[index]) return a.order[index] - b.order[index];
      return 0;
    });
    const root = { key: "", children: [], lookup: new Map() };
    for (const { track } of keyed) {
      let node = root;
      path.forEach((level, index) => {
        const part = levels[level].part(track, above[index]);
        let child = node.lookup.get(part);
        if (!child) {
          child = {
            key: node.key ? `${node.key}/${part}` : part, label: levels[level].label(track, above[index]),
            children: [], lookup: new Map(), tracks: [], deepest: 0,
          };
          node.lookup.set(part, child);
          node.children.push(child);
        }
        child.tracks.push(track);
        child.deepest = Math.max(child.deepest, track.deepest);
        node = child;
      });
      node.children.push({ track, label: leafLabel(track) });
    }
    state.tree = root;
  }

  function isOpen(key) {
    return state.fold.open !== state.fold.except.has(key);
  }

  function setOpen(key, open) {
    if (open === state.fold.open) state.fold.except.delete(key); else state.fold.except.add(key);
  }

  function buildRows() {
    const rows = [];
    const visit = (node, depth) => node.children.forEach((child, index) => {
      const band = index % 2;
      if (child.track) {
        rows.push({ kind: "track", tracks: [child.track], deepest: child.track.deepest, label: child.label, depth, band });
        return;
      }
      const open = isOpen(child.key);
      rows.push({ kind: open ? "open" : "folded", node: child, tracks: child.tracks, deepest: child.deepest, label: child.label, depth, band });
      if (open) visit(child, depth + 1);
    });
    visit(state.tree, 0);
    state.rows = rows;
    state.offsets = new Float64Array(rows.length + 1);
    rows.forEach((row, index) => { state.offsets[index + 1] = state.offsets[index] + heightOf(row); });
    setScroll(state.scroll);
  }

  function toggle(row, subtree) {
    const open = row.kind !== "open";
    const visit = (node) => {
      setOpen(node.key, open);
      if (subtree) node.children.forEach((child) => child.track || visit(child));
    };
    visit(row.node);
    buildRows();
    requestDraw();
  }

  function plot() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    const label = Math.round(Math.min(190, Math.max(100, width * 0.3)));
    return { left: label, width: Math.max(1, width - label - 8), top: axisHeight, bottom: height - overviewHeight, height };
  }

  function lowerBound(array, value) {
    let low = 0, high = array.length;
    while (low < high) {
      const middle = (low + high) >> 1;
      if (array[middle] < value) low = middle + 1; else high = middle;
    }
    return low;
  }

  function ticks(start, end, count) {
    const raw = (end - start) / Math.max(1, count);
    const power = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 5, 10].map((factor) => factor * power).find((candidate) => candidate >= raw);
    const result = [];
    for (let value = Math.ceil(start / step) * step; value <= end; value += step) result.push(value);
    return { result, step };
  }

  function formatTime(ns, step) {
    const magnitude = Math.max(Math.abs(state.start), Math.abs(state.end));
    const [unit, size] = magnitude >= 1e6 ? ["ms", 1e6] : magnitude >= 1e3 ? ["µs", 1e3] : ["ns", 1];
    const decimals = Math.max(0, Math.ceil(-Math.log10(step / size) - 1e-9));
    return `${(ns / size).toFixed(decimals)} ${unit}`;
  }

  function heightOf(row) {
    return row.kind === "open" ? rowHeight : (row.deepest + 1) * laneHeight + 4;
  }

  function upperBound(array, value) {
    let low = 0, high = array.length;
    while (low < high) {
      const middle = (low + high) >> 1;
      if (array[middle] <= value) low = middle + 1; else high = middle;
    }
    return low;
  }

  function formatDuration(ns) {
    if (ns >= 1e6) return `${(ns / 1e6).toFixed(2)} ms`;
    if (ns >= 1e3) return `${(ns / 1e3).toFixed(ns >= 1e5 ? 0 : ns >= 1e4 ? 1 : 2)} µs`;
    return `${Math.round(ns)} ns`;
  }

  function draw() {
    if (!state.trace) return;
    const scale = window.devicePixelRatio || 1;
    const area = plot();
    if (canvas.width !== Math.round(canvas.clientWidth * scale) || canvas.height !== Math.round(area.height * scale)) {
      canvas.width = Math.round(canvas.clientWidth * scale);
      canvas.height = Math.round(area.height * scale);
    }
    context.setTransform(scale, 0, 0, scale, 0, 0);
    context.fillStyle = colors.canvas;
    context.fillRect(0, 0, canvas.clientWidth, area.height);
    context.fillStyle = colors.header;
    context.fillRect(0, 0, canvas.clientWidth, area.top);
    context.fillRect(0, area.bottom, canvas.clientWidth, area.height - area.bottom);
    const span = state.end - state.start;
    const x = (time) => area.left + (time - state.start) / span * area.width;
    const offsets = state.offsets;
    const first = Math.max(0, upperBound(offsets, state.scroll) - 1);
    let last = first;
    while (last < state.rows.length && offsets[last] < state.scroll + area.bottom - area.top) last++;
    const top = (index) => area.top + offsets[index] - state.scroll;
    const clip = () => {
      context.save();
      context.beginPath();
      context.rect(0, area.top, canvas.clientWidth, area.bottom - area.top);
      context.clip();
    };
    clip();
    for (let index = first; index < last; index++) {
      const row = state.rows[index];
      if (row.kind === "open") continue;
      context.fillStyle = colors.cells[row.band];
      context.fillRect(0, top(index), area.left - 4, heightOf(row));
      context.fillStyle = colors.bands[row.band];
      context.fillRect(area.left - 4, top(index), canvas.clientWidth, heightOf(row));
    }
    context.restore();
    const axis = ticks(state.start, state.end, area.width / 110);
    context.font = "10px JetBrains Mono, ui-monospace, monospace";
    context.textBaseline = "middle";
    for (const value of axis.result) {
      const position = Math.round(x(value)) + 0.5;
      context.fillStyle = colors.grid;
      context.fillRect(position, area.top, 1, area.bottom - area.top);
      context.fillStyle = colors.muted;
      context.fillText(formatTime(value, axis.step), position + 3, axisHeight / 2);
    }
    context.fillStyle = colors.line;
    context.fillRect(0, area.top - 1, canvas.clientWidth, 1);
    clip();
    for (let index = first; index < last; index++) {
      const row = state.rows[index];
      const y = top(index), indent = 8 + row.depth * 12, middle = y + (row.kind === "open" ? rowHeight / 2 : 2 + laneHeight / 2);
      if (row.kind === "open") {
        context.fillStyle = colors.header;
        context.fillRect(0, y, canvas.clientWidth, rowHeight);
      }
      context.fillStyle = row.kind === "track" ? colors.muted : colors.ink;
      context.font = `${row.kind === "track" ? "" : "bold "}10px JetBrains Mono, ui-monospace, monospace`;
      if (row.kind !== "track") drawDisclosure(indent, middle, row.kind === "open");
      context.fillText(row.label, indent + 12, middle, Math.max(1, area.left - indent - 18));
      if (row.kind !== "open") drawRow(row, y, x, area);
    }
    context.restore();
    context.fillStyle = colors.line;
    context.fillRect(area.left - 4, area.top, 1, area.bottom - area.top);
    drawOverview(area);
    remember();
  }

  let rememberTimer = 0;
  function remember() {
    if (!state.linked || !location.protocol.startsWith("http")) return;
    clearTimeout(rememberTimer);
    rememberTimer = setTimeout(() => {
      const query = new URLSearchParams(location.search);
      query.set("group", state.group);
      query.set("start", (state.start / 1e3).toFixed(3));
      query.set("end", (state.end / 1e3).toFixed(3));
      query.delete("expand");
      query.delete("fold");
      const except = [...state.fold.except].sort().join(",");
      if (state.fold.open) query.set("expand", "all");
      if (except) query.set(state.fold.open ? "fold" : "expand", except);
      history.replaceState(null, "", `?${query.toString().replaceAll("%2F", "/").replaceAll("%2C", ",")}`);
    }, 250);
  }

  function drawDisclosure(x, y, open) {
    context.beginPath();
    if (open) {
      context.moveTo(x, y - 2);
      context.lineTo(x + 7, y - 2);
      context.lineTo(x + 3.5, y + 2.5);
    } else {
      context.moveTo(x + 1.5, y - 3.5);
      context.lineTo(x + 6, y);
      context.lineTo(x + 1.5, y + 3.5);
    }
    context.closePath();
    context.fill();
  }

  function summary(node) {
    if (node.summary) return node.summary;
    const zones = [];
    for (const track of node.tracks) {
      for (let index = 0; index < track.start.length; index++) {
        zones.push([track.depth[index], track.name[index], track.start[index], track.end[index]]);
      }
    }
    zones.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
    const merged = [];
    for (const zone of zones) {
      const last = merged[merged.length - 1];
      if (last && last[0] === zone[0] && last[1] === zone[1] && zone[2] <= last[3]) last[3] = Math.max(last[3], zone[3]);
      else merged.push(zone);
    }
    merged.sort((a, b) => a[0] - b[0] || a[2] - b[2]);
    const alone = new Uint8Array(merged.length).fill(1);
    let holder = -1;
    merged.forEach((zone, index) => {
      const reaching = merged[holder];
      if (reaching && reaching[0] === zone[0] && zone[2] < reaching[3]) alone[holder] = alone[index] = 0;
      if (!reaching || reaching[0] !== zone[0] || zone[3] > reaching[3]) holder = index;
    });
    merged.forEach((zone, index) => { zone.alone = alone[index]; });
    merged.sort((a, b) => a[2] - b[2]);
    const reach = new Float64Array(merged.length);
    merged.forEach((zone, index) => { reach[index] = Math.max(zone[3], index ? reach[index - 1] : -Infinity); });
    node.summary = {
      depth: Uint8Array.from(merged, (zone) => zone[0]), name: Int32Array.from(merged, (zone) => zone[1]),
      start: Float64Array.from(merged, (zone) => zone[2]), end: Float64Array.from(merged, (zone) => zone[3]), reach,
      alone: Uint8Array.from(merged, (zone) => zone.alone),
    };
    return node.summary;
  }

  const seenPixels = [];
  function drawRow(row, y, x, area) {
    const width = Math.ceil(area.width) + 2;
    for (let depth = 0; depth <= row.deepest; depth++) {
      if (!seenPixels[depth] || seenPixels[depth].length < width) seenPixels[depth] = new Int32Array(width);
      else seenPixels[depth].fill(0, 0, width);
    }
    if (row.kind === "track") {
      drawTrack(row.tracks[0], y, x, area, heightOf(row), true);
      return;
    }
    drawTrack(summary(row.node), y, x, area, heightOf(row), false);
    if (state.hover && state.hover.row === row) {
      const { track, index } = state.hover;
      const left = Math.max(area.left, x(track.start[index])), right = Math.min(area.left + area.width, x(track.end[index]));
      context.strokeStyle = colors.ink;
      context.lineWidth = 2;
      context.strokeRect(left, y + 2 + track.depth[index] * laneHeight, Math.max(1, right - left), laneHeight - 1);
    }
  }

  let characterWidth = 0;
  function drawLabel(name, duration, left, top, width, slot) {
    const room = Math.floor((width - 6) / characterWidth);
    const full = duration ? `${name} ${duration}` : name;
    const text = full.length <= room ? full : name.length <= room ? name : room >= 4 ? `${name.slice(0, room - 1)}…` : "";
    if (!text) return;
    context.fillStyle = colors.texts[slot];
    context.fillText(text, left + 3, top + laneHeight / 2);
  }

  function drawTrack(track, y, x, area, height, real) {
    context.font = "10px JetBrains Mono, ui-monospace, monospace";
    characterWidth ||= context.measureText("0").width;
    for (let index = lowerBound(track.reach, state.start); index < track.start.length && track.start[index] <= state.end; index++) {
      const name = track.name[index];
      if (state.hidden.has(name) || track.end[index] < state.start) continue;
      const left = Math.max(area.left, x(track.start[index]));
      const right = Math.min(area.left + area.width, x(track.end[index]));
      const depth = track.depth[index];
      if (right - left < 3) {
        const seen = seenPixels[depth], pixel = Math.floor(left - area.left);
        if (seen[pixel] === name + 1 || (right - left < 1 && seen[pixel])) continue;
        seen[pixel] = name + 1;
      }
      const top = y + 2 + depth * laneHeight, width = right - left;
      const slot = name % colors.fills.length;
      context.fillStyle = colors.fills[slot];
      context.fillRect(left, top, Math.max(1, width), laneHeight - 1);
      if (width >= 4) {
        context.fillStyle = colors.edges[slot];
        context.fillRect(left, top, 1, laneHeight - 1);
      }
      if (width > 4 * characterWidth + 6 && (real || track.alone[index])) {
        const duration = real ? formatDuration(track.end[index] - track.start[index]) : "";
        drawLabel(state.trace.names[name], duration, left, top, width, slot);
      }
      if (state.hover && state.hover.track === track && state.hover.index === index) {
        context.strokeStyle = colors.ink;
        context.lineWidth = 2;
        context.strokeRect(left, top, Math.max(1, width), laneHeight - 1);
      }
    }
    if (!real) return;
    context.fillStyle = colors.close;
    for (let index = lowerBound(track.closes, state.start); index < track.closes.length && track.closes[index] <= state.end; index++) {
      context.fillRect(Math.round(x(track.closes[index])), y + height - 4, 2, 4);
    }
  }

  function drawOverview(area) {
    const top = area.bottom + 6, height = overviewHeight - 10;
    const bins = state.trace.overview, end = state.trace.end;
    context.fillStyle = colors.line;
    context.fillRect(0, area.bottom, canvas.clientWidth, 1);
    context.fillStyle = colors.muted;
    context.font = "10px JetBrains Mono, ui-monospace, monospace";
    context.fillText("overview", 8, top + height / 2);
    context.fillStyle = colors.fills[0];
    context.globalAlpha = 0.55;
    const width = area.width / bins.length;
    bins.forEach((value, index) => {
      if (value > 0) context.fillRect(area.left + index * width, top + height * (1 - value), Math.max(1, width), height * value);
    });
    context.globalAlpha = 1;
    const left = area.left + state.start / end * area.width, right = area.left + state.end / end * area.width;
    context.strokeStyle = colors.selected;
    context.lineWidth = 2;
    context.strokeRect(Math.max(area.left, left), top - 2, Math.max(2, Math.min(area.left + area.width, right) - Math.max(area.left, left)), height + 4);
  }

  function fit() {
    state.start = 0;
    state.end = state.trace.end * 1.02;
    draw();
  }

  function zoom(factor, anchor) {
    const span = state.end - state.start;
    const next = Math.min(Math.max(span * factor, 20), state.trace.end * 4);
    state.start = anchor - (anchor - state.start) * next / span;
    state.end = state.start + next;
  }

  function maxScroll() {
    const area = plot();
    return Math.max(0, state.offsets[state.rows.length] - (area.bottom - area.top));
  }

  function timeAt(clientX) {
    const area = plot(), bounds = canvas.getBoundingClientRect();
    return state.start + (clientX - bounds.left - area.left) / area.width * (state.end - state.start);
  }

  function rowIndexAt(clientY) {
    const area = plot(), y = clientY - canvas.getBoundingClientRect().top;
    if (y < area.top || y > area.bottom) return -1;
    const index = upperBound(state.offsets, y - area.top + state.scroll) - 1;
    return index < state.rows.length ? index : -1;
  }

  function rowAt(clientY) {
    return state.rows[rowIndexAt(clientY)] ?? null;
  }

  function inLabels(clientX) {
    return clientX - canvas.getBoundingClientRect().left < plot().left;
  }

  function zoneAt(clientX, clientY) {
    const rowIndex = rowIndexAt(clientY), row = state.rows[rowIndex];
    if (!row || row.kind === "open" || inLabels(clientX)) return null;
    const area = plot(), y = clientY - canvas.getBoundingClientRect().top - area.top + state.scroll;
    const lane = Math.floor((y - state.offsets[rowIndex] - 2) / laneHeight);
    const time = timeAt(clientX), tolerance = 3 / area.width * (state.end - state.start);
    let found = null;
    for (const track of row.tracks) {
      for (let index = lowerBound(track.reach, time - tolerance); index < track.start.length && track.start[index] <= time + tolerance; index++) {
        if (track.depth[index] !== lane || state.hidden.has(track.name[index]) || track.end[index] < time - tolerance) continue;
        const distance = Math.max(track.start[index] - time, time - track.end[index], 0);
        if (!found || distance < found.distance) found = { track, index, row, distance };
      }
    }
    return found;
  }

  function showTip(found, clientX, clientY, above = false) {
    if (!found) { tip.hidden = true; return; }
    const { track, index } = found;
    const bounds = canvas.getBoundingClientRect();
    const duration = track.end[index] - track.start[index];
    tip.innerHTML = "";
    const title = document.createElement("b");
    title.textContent = `${state.trace.names[track.name[index]]} · SM ${track.sm} · CTA ${track.cta} · W${track.warp}`;
    tip.append(title, `${(track.start[index] / 1e3).toFixed(3)} µs + ${(duration / 1e3).toFixed(3)} µs`);
    tip.hidden = false;
    const left = Math.min(clientX - bounds.left + 14, bounds.width - tip.offsetWidth - 8);
    tip.style.left = `${Math.max(4, left)}px`;
    tip.style.top = `${above ? Math.max(4, clientY - bounds.top - tip.offsetHeight - 28) : clientY - bounds.top + 14}px`;
  }

  function buildControls() {
    const { names, launches } = state.trace;
    const kernels = [...new Set(launches.map((launch) => launch.kernel))];
    const dropped = launches.reduce((total, launch) => total + launch.dropped, 0);
    const title = document.getElementById("title");
    title.textContent = kernels.join(" · ") || "zone trace";
    document.title = `${title.textContent} · Zone Trace`;
    if (dropped) {
      const warning = document.createElement("span");
      warning.className = "warn";
      warning.textContent = ` · ${dropped} records dropped`;
      title.append(warning);
    }
    const clustered = launches.some((launch) => launch.cluster.some((size) => size > 1));
    if (state.group === "cluster" && !clustered) state.group = "sm";
    for (const button of document.querySelectorAll("#group button")) {
      button.disabled = button.dataset.group === "cluster" && !clustered;
      button.setAttribute("aria-pressed", String(button.dataset.group === state.group));
    }
    const legend = document.getElementById("legend");
    legend.replaceChildren(...names.map((name, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-pressed", "true");
      const swatch = document.createElement("i");
      swatch.style.background = colors.fills[index % colors.fills.length];
      swatch.style.borderColor = colors.edges[index % colors.fills.length];
      button.append(swatch, name);
      button.addEventListener("click", () => {
        if (state.hidden.has(index)) state.hidden.delete(index); else state.hidden.add(index);
        button.setAttribute("aria-pressed", String(!state.hidden.has(index)));
        draw();
      });
      return button;
    }));
  }

  async function open(bytes, view = new URLSearchParams()) {
    const error = document.getElementById("error");
    try {
      state.trace = parse(await inflate(bytes));
    } catch (failure) {
      error.textContent = failure.message;
      document.getElementById("empty").hidden = false;
      return;
    }
    document.getElementById("empty").hidden = true;
    if (Object.hasOwn(hierarchies, view.get("group"))) state.group = view.get("group");
    const expand = view.get("expand");
    const except = (expand === "all" ? view.get("fold") : expand) ?? "";
    state.fold = { open: expand === "all", except: new Set(except.split(",").filter(Boolean)) };
    state.scroll = 0;
    colors = palette();
    buildControls();
    buildTree();
    buildRows();
    fit();
    const start = Number(view.get("start") ?? NaN) * 1e3, end = Number(view.get("end") ?? NaN) * 1e3;
    if (Number.isFinite(start) && Number.isFinite(end) && end > start) {
      state.start = start;
      state.end = end;
      draw();
    }
  }

  async function fetchTrace(url) {
    const status = document.getElementById("status"), error = document.getElementById("error");
    status.textContent = `loading ${url}`;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      return new Uint8Array(await response.arrayBuffer());
    } catch (failure) {
      error.textContent = location.protocol === "file:"
        ? `A file:// page cannot load ${url}; serve it with python -m zigfa.view.`
        : failure.message;
      return null;
    } finally {
      status.textContent = "";
    }
  }

  document.querySelectorAll("#group button").forEach((button) => button.addEventListener("click", () => {
    if (!state.trace || button.disabled) return;
    state.group = button.dataset.group;
    document.querySelectorAll("#group button").forEach((other) => other.setAttribute("aria-pressed", String(other === button)));
    buildTree();
    state.scroll = 0;
    buildRows();
    draw();
  }));

  document.querySelectorAll("#fold button").forEach((button) => button.addEventListener("click", () => {
    if (!state.trace) return;
    state.fold = { open: button.dataset.open === "true", except: new Set() };
    buildRows();
    draw();
  }));

  let frame = 0;
  function requestDraw() {
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; draw(); });
  }

  function setScroll(value) {
    state.scroll = Math.min(maxScroll(), Math.max(0, value));
  }

  function panBy(dx, dy) {
    const shift = dx / plot().width * (state.end - state.start);
    state.start -= shift;
    state.end -= shift;
    setScroll(state.scroll - dy);
  }

  function centerAt(clientX) {
    const area = plot(), bounds = canvas.getBoundingClientRect();
    const time = (clientX - bounds.left - area.left) / area.width * state.trace.end;
    const span = state.end - state.start;
    state.start = time - span / 2;
    state.end = time + span / 2;
    requestDraw();
  }

  let glide = 0;
  function stopGlide() {
    cancelAnimationFrame(glide);
    glide = 0;
  }

  function glideFrom(samples) {
    const last = samples[samples.length - 1];
    const first = samples.find((sample) => last.time - sample.time <= 100);
    const elapsed = last.time - first.time;
    if (elapsed <= 0 || performance.now() - last.time > 60) return;
    let vx = (last.x - first.x) / elapsed, vy = (last.y - first.y) / elapsed;
    if (Math.hypot(vx, vy) < 0.15) return;
    let previous = performance.now();
    const step = (now) => {
      const delta = now - previous;
      previous = now;
      panBy(vx * delta, vy * delta);
      const decay = Math.exp(-delta / 325);
      vx *= decay;
      vy *= decay;
      draw();
      glide = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(step) : 0;
    };
    glide = requestAnimationFrame(step);
  }

  const pointers = new Map();
  let gesture = null, tap = null, lastTap = null;

  function beginGesture(type) {
    const points = [...pointers.values()];
    if (points.length === 1) {
      const [point] = points;
      const area = plot(), bounds = canvas.getBoundingClientRect();
      gesture = {
        kind: "pan", type, x: point.x, y: point.y, start: state.start, end: state.end, scroll: state.scroll,
        overview: point.y - bounds.top > area.bottom, samples: [{ time: performance.now(), x: point.x, y: point.y }],
      };
      if (gesture.overview) centerAt(point.x);
    } else {
      const [a, b] = points;
      gesture = {
        kind: "pinch", type, distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), anchor: timeAt((a.x + b.x) / 2),
        y: (a.y + b.y) / 2, span: state.end - state.start, scroll: state.scroll,
      };
    }
  }

  function moveGesture() {
    const points = [...pointers.values()];
    if (gesture.kind === "pan") {
      const [point] = points;
      if (gesture.overview) { centerAt(point.x); return; }
      const shift = (point.x - gesture.x) / plot().width * (gesture.end - gesture.start);
      state.start = gesture.start - shift;
      state.end = gesture.end - shift;
      setScroll(gesture.scroll - (point.y - gesture.y));
      const now = performance.now();
      gesture.samples.push({ time: now, x: point.x, y: point.y });
      while (gesture.samples.length > 2 && now - gesture.samples[0].time > 120) gesture.samples.shift();
    } else {
      const [a, b] = points;
      const area = plot(), bounds = canvas.getBoundingClientRect();
      const distance = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      const span = Math.min(Math.max(gesture.span * gesture.distance / distance, 20), state.trace.end * 4);
      state.start = gesture.anchor - ((a.x + b.x) / 2 - bounds.left - area.left) / area.width * span;
      state.end = state.start + span;
      setScroll(gesture.scroll - ((a.y + b.y) / 2 - gesture.y));
    }
    requestDraw();
  }

  function hover(event) {
    const row = rowAt(event.clientY);
    canvas.style.cursor = row && row.node && (row.kind === "open" || inLabels(event.clientX)) ? "pointer" : "";
    const found = zoneAt(event.clientX, event.clientY);
    const changed = (found && found.index) !== (state.hover && state.hover.index) || (found && found.track) !== (state.hover && state.hover.track);
    state.hover = found;
    showTip(found, event.clientX, event.clientY);
    if (changed) requestDraw();
  }

  function tapAt(event) {
    const now = performance.now();
    if (lastTap && now - lastTap.time < 320 && Math.hypot(event.clientX - lastTap.x, event.clientY - lastTap.y) < 32) {
      lastTap = null;
      tip.hidden = true;
      fit();
      return;
    }
    lastTap = { time: now, x: event.clientX, y: event.clientY };
    state.hover = zoneAt(event.clientX, event.clientY);
    showTip(state.hover, event.clientX, event.clientY, true);
    requestDraw();
  }

  canvas.addEventListener("wheel", (event) => {
    if (!state.trace) return;
    event.preventDefault();
    stopGlide();
    const area = plot();
    const unit = event.deltaMode === 1 ? rowHeight : event.deltaMode === 2 ? area.bottom - area.top : 1;
    const dx = event.deltaX * unit, dy = event.deltaY * unit;
    if (event.ctrlKey) zoom(Math.exp(Math.sign(dy) * Math.min(Math.abs(dy) * 0.01, 0.25)), timeAt(event.clientX));
    else if (event.shiftKey) panBy(-(dx + dy), 0);
    else panBy(-dx, -dy);
    requestDraw();
  }, { passive: false });

  canvas.addEventListener("pointerdown", (event) => {
    if (!state.trace) return;
    stopGlide();
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add("dragging");
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    tap = pointers.size === 1 ? { time: performance.now(), x: event.clientX, y: event.clientY } : null;
    if (event.pointerType !== "mouse") tip.hidden = true;
    beginGesture(event.pointerType);
  });

  canvas.addEventListener("pointermove", (event) => {
    if (!state.trace) return;
    if (!pointers.has(event.pointerId)) {
      if (event.pointerType === "mouse") hover(event);
      return;
    }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (tap && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) > 8) tap = null;
    tip.hidden = true;
    moveGesture();
  });

  function release(event) {
    if (!pointers.delete(event.pointerId)) return;
    const ended = gesture;
    if (pointers.size) {
      tap = null;
      beginGesture(ended.type);
      return;
    }
    gesture = null;
    canvas.classList.remove("dragging");
    const row = tap && event.type === "pointerup" ? rowAt(event.clientY) : null;
    if (row && row.node && (row.kind === "open" || inLabels(event.clientX))) toggle(row, event.shiftKey);
    else if (tap && event.type === "pointerup" && ended.type !== "mouse" && performance.now() - tap.time < 300) tapAt(event);
    else if (!tap && ended.kind === "pan" && !ended.overview && ended.type !== "mouse") glideFrom(ended.samples);
    tap = null;
  }

  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("pointerleave", (event) => { if (event.pointerType === "mouse") tip.hidden = true; });
  canvas.addEventListener("dblclick", () => { if (state.trace) fit(); });
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());
  new ResizeObserver(requestDraw).observe(document.getElementById("stage"));

  async function openFile(file) {
    if (!file) return;
    state.linked = false;
    if (location.protocol.startsWith("http")) history.replaceState(null, "", location.pathname);
    open(new Uint8Array(await file.arrayBuffer()));
  }

  document.getElementById("file").addEventListener("change", (event) => openFile(event.target.files[0]));
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => {
    event.preventDefault();
    openFile(event.dataTransfer.files[0]);
  });

  const query = new URLSearchParams(location.search);
  if (query.has("trace")) {
    state.linked = true;
    fetchTrace(query.get("trace")).then((bytes) => bytes && open(bytes, query));
  }
})();
</script>
</body>
</html>
