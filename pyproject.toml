[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zigfa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cuda-core[cu13]>=1.2",
    "cuda-python>=13.4",
    "numpy",
]

[project.optional-dependencies]
torch = ["torch>=2.6"]
test = ["pytest", "zigfa[torch]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.build.dependencies]
python = "3.11.*"
python-build = ">=1,<2"
cuda-nvcc-tools = "13.4.*"
curl = "*"
xz = "*"

[tool.pixi.environments]
default = { features = ["build"], no-default-feature = true }
