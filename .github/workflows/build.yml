name: Build wheels

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_RELEASE: nvptx-build-40638849919-1
  ZIG_ARCHIVE: zig-nvptx-x86_64-linux-musl-x86_64_v3.tar.xz
  ZIG_SHA256: fc4c5a21130f76341809cbe4abd3c7b8accb7906d9b5e71cc2973b72ed302fa9
  PTXAS: /usr/local/cuda-13.4/bin/ptxas

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Zig NVPTX compiler
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$ZIG_RELEASE" --repo bobcao3/zig-nvptx-test \
            --pattern "$ZIG_ARCHIVE" --dir "$RUNNER_TEMP"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$ZIG_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zig-nvptx"
          tar -xJf "$RUNNER_TEMP/$ZIG_ARCHIVE" -C "$RUNNER_TEMP/zig-nvptx" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig-nvptx/zig" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zig-nvptx/zig" version
      - name: Install CUDA build tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cuda-nvcc-13-4
          "$PTXAS" --version
          test -x "$(dirname "$PTXAS")/fatbinary"
      - name: Install packaging tools
        run: python -m pip install build
      - name: Run host unit tests
        run: '"$ZIG" build test'
      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python -m build
          else
            export ZIGFA_HEAD_DIM=64 ZIGFA_VARIANT=unrestricted ZIGFA_ALLOW_PARTIAL=1
            python -m build --wheel
          fi
      - name: Verify wheel contents
        shell: python
        run: |
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              assert archive.testzip() is None, "wheel contains a corrupt file"
              root = "zigfa/cubin/"
              declared = archive.read(root + "kernels.declared").decode().split()
              partial = declared[0] == "partial"
              assert partial == (os.environ["GITHUB_REF_TYPE"] != "tag"), "wrong build scope"
              expected = set(declared[1:] if partial else declared)
              manifest = archive.read(root + "kernels.manifest").decode().splitlines()
              names = {line.split()[0] for line in manifest if line and not line.startswith("#")}
              cubins = {PurePosixPath(name).stem for name in archive.namelist()
                        if name.startswith(root) and name.endswith(".cubin")}
              assert names and names == cubins, "wheel kernels do not match the manifest"
              assert names <= expected, "wheel contains undeclared kernels"
              if not partial:
                  assert names == expected, "release wheel is missing kernels"
              for name in ("profile_viewer.html", "assets/report.css"):
                  assert archive.read("zigfa/viewer/" + name), "wheel is missing viewer files"
          print(f"Verified {wheel}: {len(cubins)} kernel instances, partial={partial}")
      - name: Hash distributions
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zigfa-${{ github.ref_type }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zigfa-${{ github.ref_type }}-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
